name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep the phone number out of the public resume
        run: |
          if [ -e resume/resume-phone.tex ]; then
            echo "resume-phone.tex belongs in the private resume repo only"
            exit 1
          fi
          if grep -nE '(\+91[ -]?)?[6-9][0-9]{4}[ -]?[0-9]{5}' resume/*.tex; then
            echo "Phone number found in the public resume source"
            exit 1
          fi

      - name: Compile resume (LaTeX, same as Overleaf)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: main.tex
          latexmk_shell_escape: true

      - name: Publish resume to public/resume.pdf
        run: |
          cp resume/main.pdf public/resume.pdf
          # keep links shared before the move to /resume.pdf working
          mkdir -p public/resume
          cp resume/main.pdf public/resume/resume.pdf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Add .nojekyll file
        run: touch ./dist/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./dist
          branch: gh-pages
