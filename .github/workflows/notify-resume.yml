name: Notify private resume repo

# When the résumé source changes on the public repo, ping the private repo so it
# rebuilds the with-phone PDF. Does nothing until the RESUME_DISPATCH_TOKEN secret
# is added, so it's safe to ship as-is.

on:
  push:
    branches: [ main ]
    paths:
      - 'resume/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.RESUME_DISPATCH_TOKEN }}
    steps:
      - name: Trigger the private with-phone build
        if: ${{ env.TOKEN != '' }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jitendravjh/resume/dispatches \
            -d '{"event_type":"resume-updated"}'
